# Bouwt KijkSport bij elke wijziging op main en publiceert het op GitHub Pages.
name: Publiceren
on:
  push:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # De live versies komen altijd uit main, ook als een push op test deze workflow start.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Nieuwe versie (Speelveld) uit main, onder /kijksport/speelveld/.
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /kijksport/speelveld/
      # Vorige versie (Parcours) uit de branch parcours, op het oude adres /kijksport/. Beide versies delen de kalender uit main.
      - uses: actions/checkout@v4
        with:
          ref: parcours
          path: parcours
      - run: |
          cp src/data.json parcours/src/data.json
          cd parcours
          npm ci
          npm run build
        env:
          BASE_PATH: /kijksport/
      # Testversie uit de branch test, onder /kijksport/test/. Alleen voor de maker; de testers zien hem niet.
      # Eigen opslag (voorvoegsel proef:), eigen cache en eigen naam, zodat de live versie niet geraakt wordt. Kalender uit main.
      - id: test
        run: |
          if git ls-remote --exit-code --heads origin test >/dev/null; then echo "bestaat=ja" >> "$GITHUB_OUTPUT"; fi
      - if: steps.test.outputs.bestaat == 'ja'
        uses: actions/checkout@v4
        with:
          ref: test
          path: proef
      - if: steps.test.outputs.bestaat == 'ja'
        run: |
          cp src/data.json proef/src/data.json
          cd proef
          npm ci
          npm test
          npm run build
          bash scripts/kanaal-test.sh dist
        env:
          BASE_PATH: /kijksport/test/
          VITE_KANAAL: test
      - run: |
          mkdir site
          cp -r parcours/dist/. site/
          cp -r dist site/speelveld
          if [ -d proef/dist ]; then cp -r proef/dist site/test; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
